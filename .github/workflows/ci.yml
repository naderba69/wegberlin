name: Quality Gate
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Scan working tree and complete Git history for secrets
        run: npm run secret:audit:history
      - run: npm run check
      - name: Learner-local-day and storage-integrity gate under pinned zones (ADR-106 · م40)
        run: |
          for zone in Asia/Tunis Pacific/Kiritimati Pacific/Niue; do
            echo "::group::TZ=$zone"
            TZ=$zone node_modules/.bin/vitest run tests/unit/learner-day-key.test.ts tests/unit/state-integrity-guard.test.ts tests/unit/atomic-persistence.test.ts
            echo "::endgroup::"
          done
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run full desktop and mobile production suite
        run: npm run test:e2e
