name: QA experiment 2 (temporary)

on:
  pull_request:
    paths:
      - ".github/workflows/qa-experiment.yml"

permissions:
  contents: read
  issues: read

env:
  DEPLOYMENT_URL: ${{ inputs.deployment_url || vars.DEPLOYMENT_SMOKE_PRODUCTION_URL || 'https://wegberlin.vercel.app' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Deployment smoke default expression and run
        run: |
          set +e
          echo "::notice title=resolved DEPLOYMENT_URL on a non-dispatch event::$DEPLOYMENT_URL"
          node scripts/smoke-deployment.mjs > smoke.json 2>&1
          code=$?
          echo "::notice title=smoke exit code::$code · $(grep -o '"status": "[a-z-]*"' smoke.json | tr '\n' ' ')"
          exit 0
      - name: Monthly audit with the committed registry
        run: |
          set +e
          node scripts/audit-source-freshness.mjs --fail-on=due --probe > audit.txt 2>&1
          code=$?
          echo "::notice title=monthly audit exit code::$code"
          echo "::notice title=monthly audit report::$(tr '\n' '|' < audit.txt | cut -c1-4500)"
          exit 0
      - name: github-script v8 dry run (read-only)
        uses: actions/github-script@v8
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100 });
            const real = issues.filter((issue) => !issue.pull_request).map((issue) => `#${issue.number} ${issue.title}`);
            core.notice(`github-script v8 ran on this runner; ${real.length} open issue(s): ${real.join(" | ")}`);
