name: Tagged Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions: { contents: write }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run secret:audit:history
      - run: npm run check
      - run: node scripts/generate-release-changelog.mjs
      - uses: softprops/action-gh-release@v2
        with: { body_path: release-changelog.md }
