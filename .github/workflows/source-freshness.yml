name: Monthly source freshness
on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit dates and official URL reachability
        id: freshness
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/audit-source-freshness.mjs --fail-on=due --probe | tee source-freshness-report.txt
      - name: Open, update, or close the monthly review issue
        uses: actions/github-script@v7
        env:
          AUDIT_OUTCOME: ${{ steps.freshness.outcome }}
        with:
          script: |
            const fs = require("fs");
            const title = "[source freshness] Monthly official-source and zero-cost review";
            const report = fs.readFileSync("source-freshness-report.txt", "utf8").slice(0, 60000);
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            if (process.env.AUDIT_OUTCOME !== "success") {
              const body = [
                "The monthly machine check found a due/stale source or an unreachable official URL.",
                "",
                "A maintainer must open each affected official source, compare its meaning with the stored exam/cost rules, run the relevant tests, and only then update `lastVerifiedAt`.",
                "",
                "A successful HTTP response is **not** proof that the format, price, quota, or terms are unchanged.",
                "",
                "```text",
                report,
                "```",
              ].join("\n");
              if (existing) {
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
              } else {
                await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ["maintenance"] }).catch(async () => {
                  await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
                });
              }
              core.setFailed("Official-source/free-tier review is due; issue created or updated.");
            } else if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `The registry is current again. Automated report:\n\n\`\`\`text\n${report}\n\`\`\``,
              });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: "closed" });
            }
