name: Deployment Smoke

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "Exact Vercel Preview or Production HTTPS origin"
        required: true
        type: string
  deployment_status:

permissions:
  contents: read

env:
  # Production is checked through its PUBLIC alias (ADR-109, amending ADR-104). The deployment-specific
  # *.projects.vercel.app host that GitHub reports for a deployment sits behind Vercel Authentication, so testing it
  # would only prove the checker is unauthenticated. The repository variable overrides the alias; a manual run
  # passes its origin explicitly. Never bypass Vercel Authentication here.
  DEPLOYMENT_URL: ${{ inputs.deployment_url || vars.DEPLOYMENT_SMOKE_PRODUCTION_URL || 'https://wegberlin.vercel.app' }}

jobs:
  smoke:
    # Vercel Preview deployments are access-protected; never bypass that protection in this public smoke job.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Verify deployed critical routes and headers
        run: node scripts/smoke-deployment.mjs
      - name: Explain an authentication-blocked run
        if: failure()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          A `status=blocked-by-auth` report means the smoke never reached the app.
          Production runs default to the public alias https://wegberlin.vercel.app (the repository variable
          `DEPLOYMENT_SMOKE_PRODUCTION_URL` overrides it). A deployment-specific *.vercel.app host is behind
          Vercel Authentication: re-run this workflow with the public alias as `deployment_url`.
          Never mark smoke successful on a blocked run, and never bypass Vercel Authentication in CI.
          SUMMARY
