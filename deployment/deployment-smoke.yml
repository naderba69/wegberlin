name: Deployment Smoke

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "Exact Vercel Preview or Production HTTPS origin"
        required: true
        type: string
  deployment_status:

permissions:
  contents: read

env:
  # A deployment-specific *.projects.vercel.app URL can sit behind Vercel Authentication, which would only
  # prove the checker is unauthenticated. Prefer the public production alias when the owner has set it.
  DEPLOYMENT_URL: ${{ inputs.deployment_url || vars.DEPLOYMENT_SMOKE_PRODUCTION_URL || github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}

jobs:
  smoke:
    # Vercel Preview deployments are access-protected; never bypass that protection in this public smoke job.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Verify deployed critical routes and headers
        run: node scripts/smoke-deployment.mjs
      - name: Explain an authentication-blocked run
        if: failure()
        run: echo "If the report says status=blocked-by-auth, the smoke never reached the app: set DEPLOYMENT_SMOKE_PRODUCTION_URL to the public production alias. Never mark smoke successful on a blocked run, and never bypass Vercel Authentication in CI." >> "$GITHUB_STEP_SUMMARY"
